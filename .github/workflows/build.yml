name: Build and publish GHCR image

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 16 * * *"

concurrency:
  group: warpa-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          timestamp="$(date -u +'%Y%m%d-%H%M')"
          short_sha="${GITHUB_SHA::7}"

          {
            echo "image=${image}"
            echo "timestamp=${timestamp}"
            echo "short_sha=${short_sha}"
            echo "tags<<EOF"
            echo "${image}:latest"
            echo "${image}:sha-${short_sha}"
            echo "${image}:${timestamp}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CPA_IMAGE=eceasy/cli-proxy-api:latest
            SING_BOX_VERSION=1.13.13
            SING_BOX_SHA256_AMD64=a74001a9304c1722fdcd01a5145526a22ff35b0da9cd73a4887e910c1ce9b480
            SING_BOX_SHA256_ARM64=e58c2c6c44d9714d72c9230d81698df366fa2b4ecd6e5a551a4b77ec85b629f9
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
